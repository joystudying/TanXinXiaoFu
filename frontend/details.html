<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>案例详情 · 谈心小辅</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .profile-initial {
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, #e9f7ef, #d6ecdf);
        color: #1d5b3d;
        font-size: 64px;
        font-weight: 700;
      }
      .detail-error {
        display: block;
        margin-top: 10px;
        color: var(--danger, #b3261e);
      }
    </style>
    <script src="shared.js" defer></script>
    <script src="cases.js" defer></script>
  </head>
  <body data-page="selection">
    <a class="skip" href="#main">跳到主要内容</a>
    <header class="site-header" data-header></header>
    <main id="main" class="main">
      <a class="back-link" href="index.html"><span data-icon="back"></span>返回场景选择</a>
      <div class="page-heading coach-page-heading">
        <div>
          <h1>先了解一下<span data-case-name>这位学生</span></h1>
          <p>带着一个想了解的问题，开始这次谈话。</p>
        </div>
        <div class="coach-welcome">
          <p>先了解他的处境，<br />不用急着下结论。</p>
          <div class="coach-welcome-portrait" aria-hidden="true">
            <img src="assets/xiaofu-counselor.png" alt="" width="164" height="188" />
          </div>
        </div>
        <span class="badge" data-case-badge>—</span>
      </div>
      <div class="detail-layout">
        <aside class="surface student-profile">
          <div data-profile-photo></div>
          <h2 data-profile-name>—</h2>
          <p class="student-meta" data-profile-meta></p>
          <blockquote data-profile-quote></blockquote>
          <p class="profile-bottom" data-profile-duration></p>
        </aside>
        <section class="surface detail-content" aria-label="案例背景和谈前准备">
          <section class="detail-section">
            <h2><span data-icon="file"></span>你目前知道的情况</h2>
            <p data-case-background></p>
            <p class="muted">这些是已知线索。先听他自己的描述，不预设原因。</p>
          </section>
          <section class="detail-section">
            <h2><span data-icon="target"></span>这次重点练什么</h2>
            <ol class="goal-list" data-case-goals></ol>
          </section>
          <section class="detail-section">
            <h2><span data-icon="pen"></span>谈前准备<span class="section-optional">可选</span></h2>
            <label class="note-label" for="preparation">你想先了解什么，或提醒自己注意什么？</label
            ><textarea
              id="preparation"
              rows="3"
              maxlength="2000"
              placeholder="例如：先听近况，不急着提建议；问问他希望得到什么帮助。"
            ></textarea>
          </section>
          <div class="detail-actions">
            <small>准备好后，开始这次谈话。</small
            ><button class="button" data-start-session>
              <span data-icon="mic"></span><span data-start-label>进入谈话窗口</span
              ><span data-icon="arrow"></span>
            </button>
          </div>
          <small class="detail-error" data-session-notice hidden></small>
        </section>
      </div>
    </main>
    <footer class="site-footer" data-footer></footer>
  </body>
</html>
