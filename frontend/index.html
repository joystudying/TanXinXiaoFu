<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>场景选择 · 谈心小辅</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="shared.js" defer></script>
    <script src="cases.js" defer></script>
  </head>
  <body data-page="selection">
    <a class="skip" href="#main">跳到主要内容</a>
    <header class="site-header" data-header></header>
    <main id="main" class="main">
      <div class="page-heading coach-page-heading">
        <div>
          <h1>选择一个情境，开始练习</h1>
          <p>从学生的具体处境出发，练习倾听与回应。</p>
        </div>
        <div class="coach-welcome">
          <p>从一个情境开始，<br />一起练习倾听。</p>
          <div class="coach-welcome-portrait" aria-hidden="true">
            <img src="assets/xiaofu-counselor.png" alt="" width="164" height="188" />
          </div>
        </div>
        <div class="page-heading-tools">
          <a class="button" href="import.html"><span data-icon="plus"></span>导入案例</a>
          <label class="search"
            ><span data-icon="search"></span
            ><input
              data-search-cases
              type="search"
              aria-label="搜索学生或情境"
              placeholder="搜索学生或情境"
          /></label>
        </div>
      </div>
      <section class="my-case-bar" aria-label="我的案例" data-my-case hidden>
        <div class="my-case-info">
          <span class="my-case-label">我的案例</span>
          <strong data-my-case-name>小陈</strong>
          <span class="my-case-meta" data-my-case-meta></span>
        </div>
        <a class="my-case-open" data-my-case-open href="details.html"
          >查看案例<span data-icon="arrow"></span
        ></a>
      </section>
      <div class="selection-layout">
        <aside class="surface category-panel" aria-label="场景分类">
          <h2>训练场景</h2>
          <div class="category-list">
            <button data-category="academic" aria-pressed="true">
              <span data-icon="book"></span>学业困难
            </button>
            <button data-category="emotion" aria-pressed="false">
              <span data-icon="heart"></span>情绪困扰
            </button>
            <button data-category="relationship" aria-pressed="false">
              <span data-icon="users"></span>人际关系
            </button>
            <button data-category="family" aria-pressed="false">
              <span data-icon="home"></span>家庭困境
            </button>
            <button data-category="career" aria-pressed="false">
              <span data-icon="compass"></span>就业迷茫
            </button>
            <button data-category="risk" aria-pressed="false">
              <span data-icon="shield"></span>危机识别与联动
            </button>
          </div>
          <div class="sidebar-foot">
            <p>一次练习的三个环节</p>
            <div class="flow">
              <span>谈前准备</span><span data-icon="arrow"></span><span>模拟谈话</span
              ><span data-icon="arrow"></span><span>复盘</span>
            </div>
          </div>
        </aside>
        <section class="surface cases-panel" aria-label="学生案例">
          <div class="section-heading">
            <div>
              <h2 data-category-title>学业困难</h2>
              <p data-category-description>了解困难，回应挫败感</p>
            </div>
            <span class="caption">选择一位学生</span>
          </div>
          <div class="case-list">
            <p class="muted" data-case-loading>正在加载案例库…</p>
          </div>
          <div class="empty-state" data-search-empty hidden>
            <span data-icon="search"></span>
            <h3>没有找到匹配的案例</h3>
            <p>换一个关键词，或回到当前案例列表。</p>
            <button class="button secondary" data-clear-search>清空搜索</button>
          </div>
        </section>
      </div>
      <div class="preview-notice" data-preview-notice role="status" hidden></div>
    </main>
    <footer class="site-footer" data-footer></footer>
  </body>
</html>
