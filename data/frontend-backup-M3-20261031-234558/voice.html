<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>谈心小辅 · 语音对练</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-state="idle">
  <header class="topbar">
    <div class="brand">
      <h1>谈心小辅<span>语音对练</span></h1>
      <p class="sub">模拟训练，不构成诊断或处置建议</p>
    </div>
    <div class="actions">
      <button id="btnStart" class="btn primary">开始训练</button>
      <button id="btnEnd" class="btn" disabled>结束并重练</button>
    </div>
  </header>

  <main class="layout">
    <aside class="case" id="caseBox" hidden>
      <h2>本次案例</h2>
      <dl id="caseMeta"></dl>
      <p class="case-tip">你只能看到这些公开信息；学生的真实困扰需要你在谈话中自己发现。</p>
    </aside>

    <section class="stage">
      <div class="turns" id="turns" aria-live="polite"></div>

      <div class="statusbar">
        <span class="dot" aria-hidden="true"></span>
        <span id="status" aria-live="polite">准备好了</span>
      </div>

      <p class="hint" id="hint"></p>

      <div class="controls">
        <button id="btnTalk" class="btn big" disabled>开始说话</button>
        <button id="btnRetry" class="btn" hidden>重试这一句</button>
      </div>

      <div class="manual">
        <label for="manualText" class="sr-only">打字输入</label>
        <input id="manualText" type="text" maxlength="500"
               placeholder="也可以直接打字（识别不可用时用这个）" autocomplete="off" />
        <button id="btnSend" class="btn">发送</button>
      </div>
    </section>
  </main>

  <script type="module" src="/js/chat.js"></script>
</body>
</html>
